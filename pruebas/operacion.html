<!--
  BANCO DE PRUEBAS DEL CAMINO DE UN PEDIDO
  ========================================
  Se abre y ya: no hace falta instalar nada.

      http://localhost:8000/pruebas/operacion.html

  Qué prueba: desde que se crea un pedido hasta que se entrega, por los
  cuatro caminos (domicilio, recoger, mesa y mostrador), más lo que suele
  romperse de verdad —el doble clic, los datos basura y varios clientes
  pidiendo a la vez—.

  SOBRE QUÉ CORRE
    Sobre el modo local (localStorage), nunca contra la base de datos de
    nadie. Usa su propio almacén y lo deja como estaba al terminar.

  LO QUE NO PUEDE PROBAR
    La concurrencia DE VERDAD. El navegador es de un solo hilo: aquí dos
    clientes "a la vez" son dos llamadas seguidas. Lo que sí comprueba es
    que la defensa contra el doble envío -la clave de envío- hace su
    trabajo, que es de donde salen las facturas repetidas.
-->
