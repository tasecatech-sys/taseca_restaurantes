<body class="cierre">

<header class="inv-top">
  <div class="franja"></div>
  <div class="contenedor inv-top__barra">
    <a href="empleados.html" class="logo">
      <span class="logo__cuadros cuadros cuadros--fina"></span>
      <span>
        <span class="logo__marca">NAS<em>CAR</em></span>
        <span class="logo__sub">Cierre de inventario</span>
      </span>
    </a>
    <div class="crece"></div>
    <a href="empleados.html" class="btn btn--fantasma btn--sm">Panel</a>
  </div>
</header>

<!-- El formulario lo monta js/inventario.js. Es exactamente el mismo que
     usa la pestaña 📦 Cierre del panel, así no hay dos versiones que
     mantener por separado.

     PORTAL OPERATIVO: hay que identificarse. Si no hay sesión, lo que se
     pinta aquí es el login —el mismo del sistema— y el cierre queda
     firmado por quien entró. La mesera usa su propio usuario, el mismo
     con el que toma los pedidos. -->
<main class="contenedor inv-main" data-vista-cierre></main>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/backend.js"></script>
<script src="js/remoto.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/tema.js"></script>
<script src="js/inventario.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    NASCAR.Inventario.iniciarRegistro(document.querySelector('[data-vista-cierre]'));
  });
</script>
</body>
</html>
